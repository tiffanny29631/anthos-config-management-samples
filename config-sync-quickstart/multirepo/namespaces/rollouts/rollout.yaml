apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: repro-rollout
  namespace: my-app
  annotations:
    client.lifecycle.config.k8s.io/mutation: ignore
spec:
  replicas: 1
  selector:
    matchLabels:
      app: repro-app
  template:
    metadata:
      labels:
        app: repro-app
    spec:
      containers:
      - name: nginx
        image: nginx:1.27.0
  strategy:
    canary:
      steps:
      - setWeight: 50
      - pause: {duration: 30s}

