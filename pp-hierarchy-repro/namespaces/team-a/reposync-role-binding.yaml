# Binds the namespace reconciler SA so RepoSync can apply objects in team-a.
# metadata.name is not the default "repo-sync" so a prior RoleBinding with a
# different roleRef does not hit KNV2009 (roleRef is immutable on RoleBinding).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pp-hierarchy-repro-repo-sync
subjects:
- kind: ServiceAccount
  name: ns-reconciler-team-a-repo-sync
  namespace: config-management-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
